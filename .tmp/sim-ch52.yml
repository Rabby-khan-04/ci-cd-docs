name: Containerized service
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    name: Build and verify the image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Build
      id: build
      uses: docker/build-push-action@v7
      with:
        context: cicd-learn
        file: cicd-learn/Dockerfile
        tags: cicd-learn:${{ github.sha }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test the running container
      run: 'docker run --rm cicd-learn:${{ github.sha }} Ada | grep -q ''HELLO, ADA!''

        echo "the container serves the expected output"

        '
    - name: Report the image
      run: "echo \"image: cicd-learn:${{ github.sha }}\"\necho \"size:  $(docker images\
        \ cicd-learn:${{ github.sha }} --format '{{.Size}}')\"\n{\n  echo \"### Containerized\
        \ service\"\n  echo \"\"\n  echo \"- image: \\`cicd-learn:${{ github.sha }}\\\
        `\"\n  echo \"- size: $(docker images cicd-learn:${{ github.sha }} --format\
        \ '{{.Size}}')\"\n  echo \"\"\n  echo \"The image is built and verified, but\
        \ NOT pushed. Push happens\"\n  echo \"only on a tag, in the tag-driven release\
        \ pipeline.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  push:
    name: Push the image to the registry
    runs-on: ubuntu-24.04
    needs:
    - build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push
      uses: docker/build-push-action@v7
      with:
        context: cicd-learn
        file: cicd-learn/Dockerfile
        push: true
        tags: 'ghcr.io/${{ github.repository }}/cicd-learn:${{ github.ref_name }}

          ghcr.io/${{ github.repository }}/cicd-learn:${{ github.sha }}

          '
        cache-from: type=gha
        cache-to: type=gha,mode=max
