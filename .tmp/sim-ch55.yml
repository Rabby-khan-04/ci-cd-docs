name: Tag-driven release
'on':
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cicd-learn
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: cicd-learn/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: npm run build
    - name: '[simulated upload-artifact: dist]'
      shell: bash
      working-directory: .
      run: "mkdir -p .tmp/artifacts\ntest -e cicd-learn/dist || { echo \"::error::no\
        \ files at cicd-learn/dist\"; exit 1; }\nif [ -e cicd-learn/dist ]; then\n\
        \  tar czf .tmp/artifacts/dist.tar -C cicd-learn dist\n  ls -l \".tmp/artifacts/dist.tar\"\
        \n  echo \"SIMULATED upload of cicd-learn/dist as dist\"\nelse\n  echo \"\
        SIMULATED upload of cicd-learn/dist as dist: nothing to upload\"\nfi"
  release:
    name: Create the GitHub Release
    runs-on: ubuntu-24.04
    needs:
    - build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: '[simulated download-artifact: dist]'
      shell: bash
      working-directory: .
      run: 'mkdir -p "dist"

        test -f .tmp/artifacts/dist.tar || { echo "::error::artifact dist not found";
        exit 1; }

        tar xzf ".tmp/artifacts/dist.tar" -C "dist"

        echo "SIMULATED download of dist into dist"'
    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "tag=\"${{ github.ref_name }}\"\necho \"tag: $tag\"\necho \"creating a\
        \ release for $tag\"\n# `gh release create` is the modern way. `softprops/action-gh-release`\n\
        # is the other common one.\ngh release create \"$tag\" dist/* \\\n  --title\
        \ \"Release $tag\" \\\n  --notes \"Built from ${{ github.sha }}.\" \\\n  --repo\
        \ \"${{ github.repository }}\"\n"
    - name: Prove the artifact is attached
      run: 'echo "release created; the built files are attached to it"

        ls -l dist/

        '
